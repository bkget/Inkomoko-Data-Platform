services:
  # ====================================================
  # TIER 1: OLTP DATA SOURCE & INGESTION
  # ====================================================

  # --- postgres: Primary transactional database with logical replication enabled for CDC ---
  postgres:
    image: postgres:16-alpine
    container_name: inkomoko_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Command ensures logical replication is enabled for Debezium CDC
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env} -d ${POSTGRES_DB:?POSTGRES_DB must be set in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # --- postgres-exporter: PostgreSQL Prometheus metrics exporter for DB connection & WAL telemetry ---
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: inkomoko_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # =======================================================
  # TIER 2: REAL-TIME STREAMING & CHANGE DATA CAPTURE (CDC)
  # =======================================================

  # --- redpanda: Lightweight Kafka-compatible event streaming platform ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: inkomoko_redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092"
      - --pandaproxy-addr
      - "0.0.0.0:8082"
      - --advertise-pandaproxy-addr
      - "localhost:8082"
      - --schema-registry-addr
      - "0.0.0.0:8081"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
      - "8082:8082"
      - "8085:8081"   # Schema Registry HTTP API (host:8085 → container:8081)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # --- debezium: Kafka Connect worker streaming PostgreSQL logical replication WAL changes ---
  # Built from docker_files/Dockerfile.debezium which extends quay.io/debezium/connect:2.5 with the
  # Confluent Avro Converter plugin, enabling Avro serialization against Redpanda's schema registry.
  debezium:
    build:
      context: .
      dockerfile: docker_files/Dockerfile.debezium
    image: inkomoko-debezium:2.5
    container_name: inkomoko_debezium
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Key stays as JSON (primary key fields don't need schema evolution handling)
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      # Value uses Avro — every CDC message is validated against the schema registry
      # before it lands on the topic. Schema is auto-registered on first write and
      # evolves forward-compatibly (new nullable columns are allowed; breaking changes rejected).
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://redpanda:8081"
      # Enable the Jolokia JMX-over-HTTP agent (bundled in the Debezium image)
      # so the Debezium UI Metrics panel can reach http://debezium:8778/jolokia.
      # The entrypoint checks ENABLE_JOLOKIA (not ENABLE_JMX_AGENT) to attach
      # the jolokia-jvm-*.jar as a javaagent on port 8778.
      ENABLE_JOLOKIA: "true"
    ports:
      - "8083:8083"
      - "8778:8778"   # Jolokia HTTP/JMX bridge for Debezium UI Metrics panel
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    deploy:
      resources:
        limits:
          # Raised from 512M: Kafka Connect JVM baseline (~350-450M) + Jolokia. 512M, causing OOM kills before port 8083 ever binds.
          memory: 1G

  # --- schema-registrar: One-shot init job registering the kiva_loans Avro schema in Redpanda schema registry ---
  # Runs before connector-registrar. Debezium's AvroConverter can auto-register schemas on first write,
  # but pre-registering gives us:
  # (1) explicit schema visibility in Redpanda Console immediately on startup,
  # (2) ability to set compatibility mode (FORWARD) before any message is produced, and
  # (3) a single source of truth for the schema that lives in version control.
  schema-registrar:
    image: alpine:3.20
    container_name: inkomoko_schema_registrar
    environment:
      SCHEMA_REGISTRY_URL: http://redpanda:8081
    volumes:
      - ./config/kiva_loans_avro_schema.json:/config/kiva_loans_avro_schema.json:ro
      - ./scripts/register_schema.sh:/register_schema.sh:ro
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq > /dev/null && sh /register_schema.sh"]
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M


  # --- connector-registrar: One-shot init job auto-registering Debezium connector on startup ---

  # Renders config/debezium_postgres_source.json.template with the live .env credentials and POSTs it to Kafka Connect. 
  # This is what makes `docker compose up -d` alone sufficient to bring the pipeline to a working state — no manual
  # curl step required from the reviewer.
  connector-registrar:
    image: alpine:3.20
    container_name: inkomoko_connector_registrar
    environment:
      DEBEZIUM_URL: http://debezium:8083
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:?DEBEZIUM_CONNECTOR_NAME must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - ./config/debezium_postgres_source.json.template:/config/debezium_postgres_source.json.template:ro
      - ./scripts/register_connector.sh:/register_connector.sh:ro
    entrypoint: ["sh", "/register_connector.sh"]
    restart: "no"
    depends_on:
      debezium:
        condition: service_healthy
      schema-registrar:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 128M

  # ====================================================
  # TIER 3: ANALYTICAL STORAGE (OLAP DATA WAREHOUSE)
  # ====================================================

  # --- clickhouse: Fast columnar analytical database consuming Kafka streams into ReplacingMergeTree ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: inkomoko_clickhouse
    ports:
      - "8123:8123" # HTTP port
      - "9000:9000" # Native TCP port
      - "9363:9363" # Prometheus metrics port
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./config/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/clickhouse_prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ======================================================
  # TIER 4: TRANSFORMATION, DATA MODELING & ORCHESTRATION
  # ======================================================

  # --- airflow: Ultra-lightweight standalone Airflow (Webserver + Scheduler) ---
  airflow:
    build:
      context: .
      dockerfile: docker_files/Dockerfile.airflow
    image: inkomoko-airflow:2.9.3
    container_name: inkomoko_airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__DONOT_PICKLE: 'true'
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 60
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 60
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 300
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 300
      PATH: "/home/airflow/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set in .env}
      # Airflow webserver account - injected from .env, never hardcoded.
      AIRFLOW_WEB_USER: ${AIRFLOW_WEB_USER:?AIRFLOW_WEB_USER must be set in .env}
      AIRFLOW_WEB_PASSWORD: ${AIRFLOW_WEB_PASSWORD:?AIRFLOW_WEB_PASSWORD must be set in .env}
      AIRFLOW_WEB_EMAIL: ${AIRFLOW_WEB_EMAIL:?AIRFLOW_WEB_EMAIL must be set in .env}
      # Kiva API backfill depth, wired through so .env tuning actually reaches
      # the ingest task (src/ingest_api.py reads these directly).
      KIVA_PAGES: ${KIVA_PAGES:-3}
      KIVA_PER_PAGE: ${KIVA_PER_PAGE:-100}
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username $$AIRFLOW_WEB_USER --password $$AIRFLOW_WEB_PASSWORD --firstname Inkomoko --lastname Admin --role Admin --email $$AIRFLOW_WEB_EMAIL || true;
      (i=0; until airflow dags list | grep -q inkomoko_kiva_pipeline; do sleep 5; i=$$((i+5)); [ $$i -ge 120 ] && break; done;
      airflow dags trigger inkomoko_kiva_pipeline || true) &
      (while true; do airflow webserver --port 8080; sleep 2; done) &
      exec airflow scheduler"
    ports:
      - "8088:8080" # Exposed on port 8088 to avoid conflict with Redpanda Console on 8080
    volumes:
      # named volume preserves the SQLite metadata DB + task logs across
      # container recreation (`make clear` still wipes it via down -v).
      - airflow_data:/opt/airflow
      - ./airflow_dag:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
      - ./dbt_project:/opt/airflow/dbt_project
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      connector-registrar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          # Ultra-lightweight footprint: 1 web worker + 1 scheduler process + SQLite
          # fits comfortably in 1024M for standalone operation with concurrent dbt tasks.
          memory: 1024M

  # --- dbt: Transformation environment running dbt-clickhouse models and tests ---
  # deps are baked into the image (docker_files/Dockerfile.dbt); the project itself is bind-mounted.
  # The container also generates and serves the interactive dbt documentation site
  # (DAG lineage graph + column catalog) on :8081. `dbt run`/`dbt test` are invoked
  # via `docker exec` (independent of the foreground process), and the static server
  # reads live from ./dbt_project/target, so regenerating docs after a run refreshes
  # the served site with no restart or separate container.
  dbt:
    image: inkomoko-dbt:1.0
    build:
      context: .
      dockerfile: docker_files/Dockerfile.dbt
    container_name: inkomoko_dbt
    command: >
      sh -c "dbt docs generate || echo 'dbt docs generate failed, serving last known state';
      exec python -m http.server 8081 --directory /usr/app/target"
    volumes:
      - ./dbt_project:/usr/app
      - ./dbt_project/profiles.yml:/root/.dbt/profiles.yml
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set in .env}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set in .env}
    ports:
      - "8081:8081"
    working_dir: /usr/app
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================================
  # TIER 5: END-TO-END OBSERVABILITY, DATA QUALITY & ALERTING
  # ==========================================================

  # --- cdc-monitor: Custom Python service reconciling row counts and measuring end-to-end CDC lag ---
  # Custom exporter that continuously cross-checks Postgres vs ClickHouse row
  # counts and measures end-to-end CDC freshness lag, exposing both (plus
  # Debezium connector task health) as Prometheus metrics on :9200/metrics.
  # Runtime deps are baked into the image; live code is bind-mounted for hot reloads.
  cdc-monitor:
    image: inkomoko-cdc-monitor:1.0
    build:
      context: .
      dockerfile: docker_files/Dockerfile.cdc-monitor
    container_name: inkomoko_cdc_monitor
    working_dir: /app
    volumes:
      - ./src:/app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set in .env}
      DEBEZIUM_URL: http://debezium:8083
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:?DEBEZIUM_CONNECTOR_NAME must be set in .env}
      POLL_INTERVAL_SECONDS: "15"
    ports:
      - "9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # --- prometheus: Time-series metrics engine scraping telemetry from all pipeline layers ---
  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: inkomoko_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  # --- mailpit: Local SMTP server and inbox catching Grafana alert notification emails ---
  # Grafana doesn’t send email directly—it only acts as an SMTP client and requires an SMTP relay to deliver messages.  
  # For local dev, Mailpit provides that relay by accepting unauthenticated SMTP on `:1025` and exposing captured emails 
  # via `:8025`, so you can validate the full alert-to-email pipeline end-to-end.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: inkomoko_mailpit
    ports:
      - "8025:8025" # Web UI: view captured emails
      - "1025:1025" # SMTP submission port Grafana connects to
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # --- grafana-plugin-installer: One-shot init job provisioning ClickHouse datasource plugin for Grafana ---
  # Grafana >= 11.5’s plugin installer (whether driven by GF_INSTALL_PLUGINS or GF_PLUGINS_PREINSTALL) merges 
  # whatever you request into Grafana’s built-in default app-plugin list. There is no supported env var to 
  # install only the requested plugin without also pulling in Grafana defaults.
  # Therefore, we use a separate one-off "installer" container to install vertamedia-clickhouse-datasource directly 
  # with `grafana cli plugins install`into the shared grafana_data volume, bypassing the merge logic entirely.
  grafana-plugin-installer:
    image: grafana/grafana-oss:13.0.2
    container_name: inkomoko_grafana_plugin_installer
    entrypoint: ["grafana"]
    command: ["cli", "--pluginsDir", "/var/lib/grafana/plugins", "plugins", "install", "vertamedia-clickhouse-datasource"]
    volumes:
      - grafana_data:/var/lib/grafana
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M

  # --- grafana: Unified monitoring dashboard visualizing pipeline health, CDC sync, and alerts ---
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: inkomoko_grafana
    ports:
      - "3001:3000" # Host port 3001 mapped to internal Grafana port 3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER must be set in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      # Alert recipient for contact points provisioning
      - ALERT_RECIPIENT_NAME=${ALERT_RECIPIENT_NAME:?ALERT_RECIPIENT_NAME must be set in .env}
      - ALERT_RECIPIENT_EMAIL=${ALERT_RECIPIENT_EMAIL:?ALERT_RECIPIENT_EMAIL must be set in .env}
      # ClickHouse credentials for datasource provisioning interpolation
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set in .env}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set in .env}
      # The ClickHouse plugin is preinstalled by grafana-plugin-installer above. This disables Grafana's own 
      # default-app-plugin auto-install this project only uses Prometheus + ClickHouse, so those defaults are 
      # pure memory/disk overhead, each running as its own backend subprocess.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      # Avoid background HTTP calls to grafana.com for update checks -- not
      # useful for a local/offline demo stack, and one less thing running.
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # SMTP relay for alert notification emails -- see the mailpit service above. No auth needed: Mailpit accepts any local submission.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${GF_SMTP_HOST:?GF_SMTP_HOST must be set in .env (e.g. mailpit:1025)}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:?GF_SMTP_FROM_ADDRESS must be set in .env (e.g. alerts@inkomoko.local)}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:?GF_SMTP_FROM_NAME must be set in .env (e.g. Inkomoko Data Platform)}
      - GF_SMTP_SKIP_VERIFY=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      grafana-plugin-installer:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    deploy:
      resources:
        limits: 
          # Unified alerting + bleve index building increased Grafana’s memory baseline; 256M was OOM-killed 
          # (exit 137) ~10–15 min after startup.Even with the minimal plugin setup, usage climbed to ~80% of 
          # 512M quickly, so we set Grafana’s limit to 768M for stable headroom.
          memory: 768M

  # ====================================================
  # TIER 6: MANAGEMENT & DEVELOPER INSPECTION CONSOLES
  # ====================================================

  # --- redpanda-console: Web UI for inspecting Redpanda topics, consumer groups, and streaming records ---
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: inkomoko_redpanda_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: "http://redpanda:8081"
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M


  # --- debezium-ui: Web console for viewing Debezium CDC connector configurations and status ---
  debezium-ui:
    image: quay.io/debezium/debezium-ui:2.5
    container_name: inkomoko_debezium_ui
    ports:
      - "8084:8080"
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    depends_on:
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pg_data:
  ch_data:
  redpanda_data:
  grafana_data:
  airflow_data:
