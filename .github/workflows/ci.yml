name: Inkomoko Data Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-unit-test:
    name: 🐍 Python Lint & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # -r src/requirements-cdc-monitor.txt covers requests/psycopg/prometheus-client
          # in one place, so this can't silently drift out of sync with what
          # src/cdc_monitor.py (imported by tests/test_cdc_monitor.py) actually needs.
          pip install flake8 pytest -r src/requirements-cdc-monitor.txt

      - name: Code Quality & Linting Check (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ airflow_dags/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other style errors as warnings.
          flake8 src/ airflow_dags/ tests/ --count --exit-zero --statistics

      - name: Run Unit Tests (pytest)
        run: |
          pytest tests/ -v

  validate-infrastructure-and-dbt:
    name: 🐳 Docker Compose & dbt Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env from template and export credentials to job env
        # docker compose config and dbt parse both fail-fast on missing
        # credentials (the compose file uses ${VAR:?} and profiles.yml has no
        # fallbacks), so they get them from the committed .env.example.
        run: |
          cp .env.example .env
          while IFS='=' read -r key value; do
            case "$key" in \#*|'') continue ;; esac
            echo "$key=$value" >> "$GITHUB_ENV"
          done < .env

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config

      - name: Set up Python 3.11 for dbt
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-clickhouse
        run: |
          pip install -r src/requirements-dbt.txt

      - name: Validate dbt Syntax & Models
        run: |
          dbt parse --project-dir dbt_project --profiles-dir dbt_project

      - name: Validate Airflow DAGs import cleanly
        # Imports every DAG through Airflow's DagBag inside the official Airflow
        # image, so a broken DAG (bad operator signature, typo'd import, ...) is
        # caught in CI instead of only when the scheduler first picks it up.
        run: |
          docker run --rm \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -v "${{ github.workspace }}/airflow_dags:/opt/dags" \
            apache/airflow:2.9.3-python3.11 \
            bash -c "pip install --no-cache-dir --disable-pip-version-check -q 'psycopg[binary]==3.3.5' && \
              python -c \"from airflow.models import DagBag; db = DagBag('/opt/dags', include_examples=False); assert not db.import_errors, db.import_errors; assert 'inkomoko_kiva_pipeline' in db.dags, list(db.dags); print('DAG import OK:', list(db.dags))\""

  integration-test:
    name: 🔄 End-to-End CDC + dbt Integration Test
    runs-on: ubuntu-latest
    # Only pay for the expensive full-stack test once the cheap, fast checks pass.
    needs: [lint-and-unit-test, validate-infrastructure-and-dbt]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Export credentials from .env to job env
        run: |
          while IFS='=' read -r key value; do
            case "$key" in \#*|'') continue ;; esac
            echo "$key=$value" >> "$GITHUB_ENV"
          done < .env

      - name: Start Postgres, Redpanda, Debezium, ClickHouse & observability sidecars
        run: |
          docker compose up -d --wait --wait-timeout 180 \
            postgres redpanda debezium clickhouse cdc-monitor postgres-exporter

      - name: Register the Debezium CDC connector
        run: docker compose up connector-registrar --exit-code-from connector-registrar

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Ingest real data from the Kiva API into Postgres
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASS: ${{ env.POSTGRES_PASSWORD }}
          DB_NAME: ${{ env.POSTGRES_DB }}
        run: |
          pip install -r src/requirements.txt
          python src/ingest_api.py

      - name: Wait for CDC events to replicate into ClickHouse
        run: |
          set +e
          SUCCESS=0
          for i in $(seq 1 20); do
            COUNT=$(curl -s -u "${{ env.CLICKHOUSE_USER }}:${{ env.CLICKHOUSE_PASSWORD }}" \
              "http://localhost:8123/?query=SELECT%20count()%20FROM%20raw_data.kiva_loans_raw" | tr -d '[:space:]')
            echo "Attempt $i: ClickHouse row count = ${COUNT:-<empty>}"
            case "$COUNT" in
              ''|*[!0-9]*) : ;;
              *)
                if [ "$COUNT" -gt 0 ]; then SUCCESS=1; fi
                ;;
            esac
            [ "$SUCCESS" -eq 1 ] && break
            sleep 5
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Timed out waiting for CDC events to reach ClickHouse."
            docker compose logs debezium clickhouse
            exit 1
          fi
          echo "CDC replication confirmed: $COUNT row(s) in ClickHouse."

      - name: Run dbt (staging -> intermediate -> marts) against the live warehouse
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: ${{ env.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ env.CLICKHOUSE_PASSWORD }}
        run: |
          pip install -r src/requirements-dbt.txt
          dbt run --project-dir dbt_project --profiles-dir dbt_project
          dbt test --project-dir dbt_project --profiles-dir dbt_project
          dbt source freshness --project-dir dbt_project --profiles-dir dbt_project

      - name: Verify the CDC observability exporter is reporting real metrics
        run: |
          curl -sf http://localhost:9200/metrics | grep -E \
            "cdc_row_count_drift|cdc_replication_lag_seconds|debezium_connector_state"

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
