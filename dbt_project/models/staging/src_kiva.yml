version: 2

sources:
  - name: raw_data
    description: "The raw CDC streams ingested directly from PostgreSQL via Debezium and Redpanda"
    database: raw_data
    tables:
      - name: kiva_loans_raw
        description: "Raw events representing inserts and updates on the Kiva loans OLTP table"
        loaded_at_field: source_updated_at
        freshness:
          warn_after: { count: 15, period: minute }
          error_after: { count: 30, period: minute }
        columns:
          - name: id
            tests:
              - not_null
